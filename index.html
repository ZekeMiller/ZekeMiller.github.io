<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeke Miller</title>
<meta name="description" content="Zeke Miller's corner of the internet: small tools, games, and rankings.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='system-ui' font-weight='700'>Z</text></svg>">
<style>
  :root {
    color-scheme: dark;
    --bg: #16171a; --card: #1f2125; --ink: #ecebe7; --muted: #9a9ca3; --line: #2e3036; --accent: #8b85ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.55;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 72px 24px 48px; }
  h1 { font-size: 40px; letter-spacing: -0.02em; margin: 0; }
  .intro { color: var(--muted); font-size: 18px; margin: 8px 0 48px; }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    margin: 40px 0 12px; font-weight: 600;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  a.card {
    display: flex; gap: 16px; align-items: center; padding: 16px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; color: inherit; text-decoration: none;
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  a.card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 6px 20px rgba(0,0,0,.06); }
  a.card.soon { pointer-events: none; opacity: .6; }
  .thumb {
    flex: 0 0 64px; height: 64px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line);
    display: grid; place-items: center;
  }
  .card strong { display: block; font-size: 16px; }
  .card span { display: block; color: var(--muted); font-size: 14px; }
  .tag {
    display: inline-block !important; font-size: 11px !important; font-weight: 600; color: var(--accent) !important;
    border: 1px solid currentColor; border-radius: 999px; padding: 0 7px; margin-left: 6px; vertical-align: 2px;
  }
  ul.links { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 10px; }
  ul.links a {
    display: inline-block; padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px;
    color: inherit; text-decoration: none; background: var(--card); font-size: 14px;
  }
  ul.links a:hover { border-color: var(--accent); }
  footer { margin-top: 64px; color: var(--muted); font-size: 13px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Zeke Miller</h1>
  <p class="intro">Small tools, games, and opinions I made for myself and my friends.</p>

  <h2>Things I made</h2>
  <div class="grid">
    <a class="card" href="/alignment/">
      <div class="thumb" aria-hidden="true">
        <svg width="44" height="44" viewBox="0 0 44 44">
          <line x1="22" y1="3" x2="22" y2="41" stroke="currentColor" stroke-width="2"/>
          <line x1="3" y1="22" x2="41" y2="22" stroke="currentColor" stroke-width="2"/>
          <rect x="6" y="8" width="12" height="6" rx="3" fill="#ffc9c9"/>
          <rect x="26" y="12" width="13" height="6" rx="3" fill="#a5d8ff"/>
          <rect x="9" y="28" width="11" height="6" rx="3" fill="#b2f2bb"/>
          <rect x="27" y="31" width="10" height="6" rx="3" fill="#ffec99"/>
        </svg>
      </div>
      <div>
        <strong>Alignment Chart Maker</strong>
      </div>
    </a>

    <a class="card soon" href="#" aria-disabled="true">
      <div class="thumb" aria-hidden="true" style="font-size:28px">🧩</div>
      <div>
        <strong>Thinky Games Ranking <span class="tag">soon</span></strong>
      </div>
    </a>
  </div>

  <h2>Elsewhere</h2>
  <ul class="links">
    <li><a href="https://github.com/ZekeMiller">GitHub</a></li>
  </ul>

  <footer>
    © Zeke Miller · <a href="https://github.com/ZekeMiller/ZekeMiller.github.io">source</a>
  </footer>
</div>
</body>
</html>
